class Component extends DCLogic {\

if (step === 'verify') { if (String(f.otpM || '').trim() !== '123456' || String(f.otpE || '').trim() !== '654321') { return 'The codes do not match. Demo codes: SMS 123456, email 654321.'; } }\
if (step === 1) {\

}\

go(step) { this.setState({ step: step, err: '', restored: false }); if (typeof step === 'number') { this.saveDraft(step); } }\

}\

FIELDS.forEach((k) => { out['v_' + k] = f[k] || ''; out['h_' + k] = (e) => this.setF(k, e.target.value); });\
BOOLS.forEach((k) => { out['v_' + k] = !!f[k]; out['h_' + k] = (e) => this.setF(k, e.target.checked); });\
['ntn', 'secp', 'srb'].forEach((k) => { out['c_' + k] = chk[k] || ''; out['cc_' + k] = chkOk[k] ? '#067a35' : '#b00020'; out['chk_' + k] = () => this.check(k); });\

out.stepItems = STEPS.map((s, i) => { const n = i + 1; const done = n < cur; const now = n === cur; return { title: s[0], sub: s[1], mark: done ? 'âœ“' : String(n), bd: (done || now) ? '#067a35' : '#9bb8a5', bg: done ? '#067a35' : '#ffffff', fg: done ? '#ffffff' : (now ? '#067a35' : '#6b8576'), tc: (done || now) ? '#0b4d24' : '#4d6654' }; });\

const rows = [['Applicant', f.an], ['CNIC', f.ac], ['Mobile (verified)', f.am], ['Email (verified)', f.ae], ['Employer name', f.en], ['Business type', f.bt], ['Business address', f.ba], ['District / Province', (f.dist || '') + ', Sindh'], ['SECP certificate no.', f.secp], ['NTN', f.ntn], ['SRB registration no.', f.srb], ['GPS location', f.gps], ['Documents uploaded', Object.keys(docs).length + ' file(s)'], ['Contact person', (f.pn || '') + ', ' + (f.pd || '')], ['Contact mobile / email', (f.pm || '') + ' / ' + (f.pe || '')], ['Expected workers', f.wk], ['Operations started', f.st]];\
out.summary = rows.map((r, i) => ({ l: r[0], v: r[1] || '-', bg: i % 2 ? '#f7faf8' : '#ffffff' }));\
